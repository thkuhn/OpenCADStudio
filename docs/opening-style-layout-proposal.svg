  <rect x="1037" y="184" width="191" height="26" rx="4" class="panel"/>
  <text x="1049" y="202" class="caption">0°</text>
  <text x="52" y="216" class="caption">Klar beschriftete Felder; die Zeilen passen sich bei schmaleren Dialogen an.</text>

