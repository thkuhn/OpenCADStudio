<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #202b3c; }
      .caption { font-size: 13px; fill: #607087; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #52647a; }
      .panel { fill: #ffffff; stroke: #b8c5d5; stroke-width: 1.5; }
      .soft { fill: #f2f6fa; stroke: #c8d3df; stroke-width: 1; }
      .accent { fill: #e6f1ff; stroke: #5d8fc9; stroke-width: 1.5; }
      .guide { stroke: #9aabba; stroke-width: 1; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1280" height="820" fill="#e9eef4"/>
  <text x="24" y="30" font-size="20" font-weight="700">Öffnungsstil-Manager — Layoutvorschlag</text>
  <text x="24" y="52" class="caption">Responsiver Dialog · Mindestgröße etwa 1280 × 820 · Bereiche bleiben sichtbar und scrollen bei Bedarf intern</text>

